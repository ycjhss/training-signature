<script>
  // (상단 코드는 그대로 두고, 아래 함수 2개만 수정/교체하세요)

  async function viewSignList(id, title) { 
    currentTrainingId = id; 
    hideAllSections(); 
    document.getElementById('signListHeading').textContent = `${title} 명부`; 
    showLoading('서명 데이터를 불러오는 중...');
    const res = await callAPI('getSignatures', { trainingId: id });
    hideLoading();
    if(res.status === 'success') {
      const tbody = document.getElementById('signListBody');
      tbody.innerHTML = '';
      res.data.forEach(item => {
        // [수정] 서명 링크 대신 실제 이미지를 태그로 삽입하여 인쇄 시 보이게 함
        tbody.innerHTML += `<tr>
          <td>${item.name}</td>
          <td>${item.affiliation}</td>
          <td>${item.role}</td>
          <td>${item.timestamp}</td>
          <td><img src="${item.url}" style="width:100px; height:50px;" /></td>
        </tr>`;
      });
      document.getElementById('signList').classList.remove('hidden');
    }
  }

  // 인쇄 함수를 호출할 때 이미지가 깨지지 않도록 보완
  function printSignList() {
    const printWindow = window.open('', '_blank');
    const content = document.getElementById('signList').innerHTML;
    printWindow.document.write('<html><head><title>인쇄</title>');
    printWindow.document.write('<style>table { width:100%; border-collapse:collapse; } th,td { border:1px solid #000; padding:5px; } img { width:80px; height:40px; }</style>');
    printWindow.document.write('</head><body>' + content + '</body></html>');
    printWindow.document.close();
    printWindow.print();
  }
</script>
