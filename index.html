<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>연수 서명 시스템</title>
</head>
<body>
    <h1>연수 서명 시스템</h1>
    <button onclick="loadList()">목록 새로고침</button>
    <table border="1" style="width:100%; margin-top:10px; border-collapse:collapse;">
        <thead>
            <tr><th>연수명</th><th>일자</th><th>기능</th></tr>
        </thead>
        <tbody id="listBody"></tbody>
    </table>

    <script>
        // 💡 [웹 앱] 배포 후 얻은 /exec 주소를 여기에 넣으세요
        const API_URL = "https://script.google.com/macros/s/AKfycbw1b2Vik9iqrOnZgXfDgaPAsV7Vc3qC7hNw3TwDhduoTN5jC4Bp0mDQ8VA6dUbIaKwy/exec";

        async function loadList() {
            const tbody = document.getElementById('listBody');
            tbody.innerHTML = "<tr><td colspan='3'>데이터 불러오는 중...</td></tr>";
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // 데이터가 안 나올 경우를 대비
                    body: JSON.stringify({action: 'getTrainingList'})
                });
                // ... 이후 데이터 처리 로직 ...
                alert("통신 시도 완료. F12 콘솔을 확인하세요.");
            } catch(e) {
                tbody.innerHTML = `<tr><td colspan='3'>에러: ${e.message}</td></tr>`;
            }
        }
        loadList();
    </script>
</body>
</html>
