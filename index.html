<!DOCTYPE html>
<html>
<head><base target="_top"></head>
<body>
  <div id="app">
    <h1>연수 서명 명부</h1>
    <table id="listTable" border="1">
      <thead><tr><th>연수명</th><th>일자</th><th>명부</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>

  <script>
    // 💡 매우 중요: 구글 앱스크립트에서 배포 후 나오는 [웹 앱 URL]을 여기에 넣으세요
    const API_URL = "https://script.google.com/macros/s/AKfycbzLWWQsAg-bW1v_q1ZhwN9Ui1Qo33SqfU6ZStb0fv3-F0JUCRcTmfYRFuRtA_7uQH2P/exec";

    async function loadList() {
      const res = await fetch(API_URL, {method:'POST', body: JSON.stringify({action: 'getTrainingList'})}).then(r=>r.json());
      const tbody = document.getElementById('listBody');
      res.data.forEach(item => {
        tbody.innerHTML += `<tr><td>${item.title}</td><td>${item.date}</td>
          <td><button onclick="viewSign('${item.id}', '${item.title}')">보기</button></td></tr>`;
      });
    }
    
    async function viewSign(id, title) {
      const res = await fetch(API_URL, {method:'POST', body: JSON.stringify({action: 'getSignatures', trainingId: id})}).then(r=>r.json());
      let html = `<h2>${title}</h2><button onclick="location.reload()">목록으로</button><table border="1">`;
      res.data.forEach(item => {
        html += `<tr><td>${item.name}</td><td><img src="${item.url}" style="width:100px;"></td></tr>`;
      });
      document.getElementById('app').innerHTML = html + '</table>';
    }
    loadList();
  </script>
</body>
</html>
