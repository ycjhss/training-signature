<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>연수 서명 시스템</title>
</head>
<body>
    <h1>연수 서명 시스템</h1>
    <button onclick="loadList()">목록 새로고침</button>
    <table border="1" style="width:100%; margin-top:10px; border-collapse:collapse;">
        <thead>
            <tr><th>연수명</th><th>일자</th><th>기능</th></tr>
        </thead>
        <tbody id="listBody"></tbody>
    </table>

    <script>
        // 💡 [웹 앱] 배포 후 얻은 /exec 주소를 여기에 넣으세요
        const API_URL = "https://script.google.com/macros/s/AKfycbw1b2Vik9iqrOnZgXfDgaPAsV7Vc3qC7hNw3TwDhduoTN5jC4Bp0mDQ8VA6dUbIaKwy/exec";

        async function loadList() {
        const tbody = document.getElementById('listBody');
        try {
            // 구글 서버로 데이터 요청
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({action: 'getTrainingList'})
            });
            
            // 텍스트로 결과를 먼저 받아봅니다 (JSON 에러 확인용)
            const text = await res.text();
            console.log("서버 응답 내용:", text); // F12 콘솔에서 확인
            
            // 데이터 파싱
            const data = JSON.parse(text);
            if(data.status === 'success') {
                tbody.innerHTML = '';
                data.data.forEach(item => {
                    tbody.innerHTML += `<tr><td>${item.title}</td><td>${item.date}</td><td><button>보기</button></td></tr>`;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan='3'>서버 에러: ${data.message}</td></tr>`;
            }
        } catch(e) {
            tbody.innerHTML = `<tr><td colspan='3'>연결 에러: ${e.message}</td></tr>`;
        }
    }
    loadList();
</script>
</body>
</html>
